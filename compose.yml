services:
  postgres:
    image: postgres:17.7-alpine
    profiles: ["database"]
    environment:
      POSTGRES_DB: jausi
      POSTGRES_USER: jausi
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD locally}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U jausi"]
      interval: 5s
      timeout: 3s
      retries: 10
volumes:
  postgres-data:
