name: Azure infrastructure validation

on:
  pull_request:
    branches: [main, develop]
    paths:
      - 'infra/azure/**'
      - '.github/workflows/azure-infra.yml'
      - '.github/workflows/azure-release.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: infra/azure
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.12.2
      - run: terraform init -backend=false -input=false
      - run: terraform validate
      - run: az bicep build --file bootstrap.bicep --stdout > /dev/null
      - run: node --check probe/server.mjs
